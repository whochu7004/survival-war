<style>

}

<div class="wrap">

  <p class="note">이 애니메이션은 대비 훈련용 가상 이야기예요. 등장인물, 마을, 대피소 지정 여부, 도로 상황, 피난 목적지는 모두 꾸민 설정이에요. 실제 비상 상황에서는 정부·지자체·군의 공식 안내를 따르고, 가까운 대피소는 안전디딤돌 앱이나 국민재난안전포털에서 미리 확인해 두세요.</p>

<script>
const W = 1600, H = 900;
const CH = {
  jw: {name: '정우', c: '#4A6FA5'}, sy: {name: '수연', c: '#4E8F6B'}, sj: {name: '서진', c: '#5FA8BF'},
  mj: {name: '민재', c: '#E07B39'}, pk: {name: '박 할아버지', c: '#9A7656'}, uncle: {name: '큰외삼촌', c: '#C29A45'},
  msg: {name: '재난문자', c: '#C0392B'}, office: {name: '관리사무소', c: '#8C8F8A'}, officer: {name: '공무원', c: '#8C8F8A'},
  stranger: {name: '지나던 사람', c: '#8C8F8A'}, police: {name: '경찰', c: '#2F3E5A'},
  aunt: {name: '외숙모', c: '#B5838D'}, doctor: {name: '공중보건의', c: '#8C8F8A'}, chief: {name: '이장', c: '#7A8A6E'}, radio: {name: '라디오', c: '#8C8F8A'}
};
const FB = '"IBM Plex Sans KR", "Malgun Gothic", sans-serif';
const FD = '"Gowun Batang", "Batang", serif';
const FH = '"Nanum Pen Script", "Gowun Batang", cursive';

/* ---------- 그리기 도구 ---------- */
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function lin(c, y0, y1, stops) { const g = c.createLinearGradient(0, y0, 0, y1); for (const [o, col] of stops) g.addColorStop(o, col); return g; }
function sky(c, stops) { c.fillStyle = lin(c, 0, H, stops); c.fillRect(0, 0, W, H); }
function rng(s) { return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
function clamp(v, a = 0, b = 1) { return Math.max(a, Math.min(b, v)); }
function txt(c, s, x, y, o = {}) { c.font = o.font || `500 28px ${FB}`; c.fillStyle = o.color || '#fff'; c.textAlign = o.align || 'left'; c.textBaseline = 'alphabetic'; c.fillText(s, x, y); }
function wrap(c, s, x, y, maxW, lh) { const words = s.split(' '); let line = ''; for (const w of words) { const t = line ? line + ' ' + w : w; if (c.measureText(t).width > maxW && line) { c.fillText(line, x, y); line = w; y += lh; } else line = t; } if (line) c.fillText(line, x, y); }
function stars(c, T, n = 90, seed = 11) { const r = rng(seed); c.fillStyle = '#fff'; for (let i = 0; i < n; i++) { const x = r() * W, y = r() * H * .45, s = r() * 2 + .6; c.globalAlpha = .25 + .45 * (.5 + .5 * Math.sin(T * 1.5 + i * 1.7)); c.fillRect(x, y, s, s); } c.globalAlpha = 1; }
function ridge(c, base, amp, col, seed, off = 0) { c.fillStyle = col; c.beginPath(); c.moveTo(0, H); for (let x = 0; x <= W + 16; x += 16) { const u = (x + off) * .0021; c.lineTo(x, base - amp * (.55 + .3 * Math.sin(u * 1.7 + seed) + .15 * Math.sin(u * 5.3 + seed * 2.1))); } c.lineTo(W, H); c.closePath(); c.fill(); }
function block(c, x, y, w, h, col, lit, seed, winOff = 'rgba(0,0,0,.22)') { c.fillStyle = col; c.fillRect(x, y, w, h); const r = rng(seed); const cols = Math.floor((w - 16) / 30), rows = Math.floor((h - 30) / 34); for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) { c.fillStyle = r() < lit ? 'rgba(255,214,140,.92)' : winOff; c.fillRect(x + 12 + i * 30, y + 14 + j * 34, 16, 20); } }

function person(c, x, y, s, col, o = {}) {
  const ph = o.walk != null ? Math.sin(o.walk) : 0;
  c.save(); c.translate(x, y); c.scale(o.flip ? -s : s, s); c.lineCap = 'round';
  c.strokeStyle = o.pants || '#26302E'; c.lineWidth = 11; c.beginPath();
  if (o.sit) { c.moveTo(-6, -58); c.lineTo(26, -58); c.lineTo(28, 0); c.moveTo(6, -58); c.lineTo(36, -58); c.lineTo(38, 0); }
  else if (o.kneel) { c.moveTo(-7, -60); c.lineTo(-10, -22); c.lineTo(-44, -6); c.moveTo(7, -60); c.lineTo(30, -40); c.lineTo(32, 0); }
  else { c.moveTo(-7, -60); c.lineTo(-7 + ph * 16, 0); c.moveTo(7, -60); c.lineTo(7 - ph * 16, 0); }
  c.stroke();
  if (o.bag) { c.fillStyle = o.bag; rr(c, -38, -120, 24, 48, 6); c.fill(); }
  c.fillStyle = col; rr(c, -21, -124, 42, 72, 15); c.fill();
  c.strokeStyle = col; c.lineWidth = 11; c.beginPath();
  c.moveTo(-17, -112);
  if (o.armUp) c.lineTo(-36, -172 + Math.sin((o.T || 0) * 8) * 10); else c.lineTo(-25 - ph * 10, -66);
  c.moveTo(17, -112);
  if (o.reach) c.lineTo(46, -98); else if (o.armUp2) c.lineTo(38, -150); else c.lineTo(25 + ph * 10, -66);
  c.stroke();
  c.fillStyle = o.skin || '#E6C3A1'; c.beginPath(); c.arc(0, -144, 19, 0, Math.PI * 2); c.fill();
  c.fillStyle = o.hair || '#2B2420'; c.beginPath(); c.arc(0, -149, 19.5, Math.PI * 1.02, Math.PI * 1.98); c.fill();
  if (o.long) { c.fillRect(-19, -151, 8, 36); c.fillRect(11, -151, 8, 36); }
  if (o.hat) { c.fillStyle = o.hat; rr(c, -24, -166, 48, 9, 4); c.fill(); rr(c, -15, -180, 30, 18, 6); c.fill(); }
  if (o.cane) { c.strokeStyle = '#5A4636'; c.lineWidth = 5; c.beginPath(); c.moveTo(27, -68); c.lineTo(33, 0); c.stroke(); }
  if (o.item) { c.fillStyle = o.item; rr(c, 34, -112, 18, 28, 3); c.fill(); }
  c.restore();
}
function lying(c, x, y, s, col, o = {}) { c.save(); c.translate(x, y); c.rotate(-Math.PI / 2); person(c, 0, 0, s, col, o); c.restore(); }
function car(c, x, y, s, col, o = {}) {
  c.save(); c.translate(x, y); c.scale(o.flip ? -s : s, s);
  c.fillStyle = col; rr(c, -95, -56, 190, 40, 12); c.fill(); rr(c, -58, -90, 110, 40, 16); c.fill();
  c.fillStyle = 'rgba(190,215,232,.85)'; rr(c, -48, -83, 44, 28, 6); c.fill(); rr(c, 0, -83, 44, 28, 6); c.fill();
  c.fillStyle = '#161A1C'; c.beginPath(); c.arc(-54, -16, 18, 0, 7); c.moveTo(72, -16); c.arc(54, -16, 18, 0, 7); c.fill();
  if (o.lights) { c.fillStyle = '#FFE7A3'; c.fillRect(88, -46, 9, 10); }
  if (o.tail) { c.fillStyle = '#E8412F'; c.fillRect(-97, -46, 7, 10); }
  c.restore();
}
function truck(c, x, y, s, flip) {
  c.save(); c.translate(x, y); c.scale(flip ? -s : s, s);
  c.fillStyle = '#4E5A3A'; rr(c, -150, -122, 200, 100, 8); c.fill();
  c.fillStyle = '#5D6B45'; rr(c, 55, -96, 82, 76, 8); c.fill();
  c.fillStyle = 'rgba(190,210,200,.6)'; c.fillRect(86, -88, 40, 26);
  c.fillStyle = '#161A1C'; for (const a of [-110, -40, 96]) { c.beginPath(); c.arc(a, -18, 20, 0, 7); c.fill(); }
  c.restore();
}
function pickup(c, x, y, s) {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = '#E9ECEA'; rr(c, -40, -110, 90, 80, 10); c.fill();
  c.fillStyle = '#9FB6C4'; c.fillRect(-28, -98, 52, 32);
  c.fillStyle = '#3E6E9E'; c.fillRect(-160, -60, 210, 34); c.fillStyle = '#D9DDDB'; c.fillRect(-160, -66, 120, 8);
  c.fillStyle = '#161A1C'; for (const a of [-120, 10]) { c.beginPath(); c.arc(a, -20, 20, 0, 7); c.fill(); }
  c.restore();
}
function tent(c, x, y, w, col) { c.fillStyle = '#F1F1EC'; c.fillRect(x, y - 80, w, 80); c.fillStyle = col; c.beginPath(); c.moveTo(x - 12, y - 80); c.lineTo(x + w / 2, y - 132); c.lineTo(x + w + 12, y - 80); c.closePath(); c.fill(); c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(x + w / 2 - 18, y - 60, 36, 60); }
function tree(c, x, y, s, col) { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = '#4B3A2A'; c.fillRect(-16, -130, 32, 130); c.fillStyle = col; for (const [a, b, r] of [[0, -210, 115], [-90, -165, 85], [90, -165, 90], [-45, -265, 85], [55, -255, 90]]) { c.beginPath(); c.arc(a, b, r, 0, 7); c.fill(); } c.restore(); }
function sirenWaves(c, x, y, T, col) { c.strokeStyle = col; c.lineWidth = 5; for (let k = 0; k < 4; k++) { const p = (T * .6 + k / 4) % 1; c.globalAlpha = 1 - p; c.beginPath(); c.arc(x, y, 40 + p * 260, -Math.PI * .85, -Math.PI * .15); c.stroke(); } c.globalAlpha = 1; }
function smoke(c, x, y, T) { for (let i = 0; i < 14; i++) { const p = (T * .07 + i / 14) % 1; c.fillStyle = `rgba(55,55,58,${.4 * (1 - p)})`; c.beginPath(); c.arc(x + Math.sin(i * 1.3 + T * .3) * 30 + p * 170, y - p * 430, 30 + p * 120, 0, 7); c.fill(); } }
function road(c, y, h, T, speed) { c.fillStyle = '#3B3F42'; c.fillRect(0, y, W, h); c.fillStyle = '#E8E2C8'; const off = (T * speed) % 120; for (let x = -off; x < W; x += 120) c.fillRect(x, y + h / 2 - 4, 60, 8); }
function sign(c, x, y, w, h, bg, fg, s, size = 30) { c.fillStyle = bg; rr(c, x, y, w, h, 6); c.fill(); txt(c, s, x + w / 2, y + h / 2 + size * .36, {font: `700 ${size}px ${FB}`, color: fg, align: 'center'}); }
function wave(c, x0, x1, yc, prog, kind, col) { c.strokeStyle = col; c.lineWidth = 4; c.beginPath(); for (let x = x0; x <= x0 + (x1 - x0) * prog; x += 3) { const u = (x - x0) / (x1 - x0); let f; if (kind === 'flat') f = Math.sin(u * 140) * 22; else { const env = .5 + .5 * Math.sin(u * Math.PI * 6 - Math.PI / 2); f = Math.sin(u * 160 + env * 18) * (10 + env * 40); } x === x0 ? c.moveTo(x, yc + f) : c.lineTo(x, yc + f); } c.stroke(); }

/* 지하 주차장 배경 (세이프 1, 정전 장면 공용) */
function parking(c, T) {
  c.fillStyle = '#4A4F52'; c.fillRect(0, 0, W, H); c.fillStyle = '#373B3E'; c.fillRect(0, 0, W, 120);
  for (let x = 100; x < W; x += 300) { c.fillStyle = `rgba(235,240,220,${.6 + .3 * Math.sin(T * 13 + x)})`; c.fillRect(x, 102, 140, 10); }
  c.fillStyle = '#5D6266'; c.fillRect(0, 640, W, 260);
  c.strokeStyle = 'rgba(240,230,180,.45)'; c.lineWidth = 5; for (let x = 40; x < W + 60; x += 220) { c.beginPath(); c.moveTo(x, 660); c.lineTo(x - 60, 900); c.stroke(); }
  for (const [x, l] of [[260, 'A'], [800, 'B'], [1340, 'C']]) { c.fillStyle = '#8A8F92'; c.fillRect(x - 60, 112, 120, 560); for (let k = 0; k < 6; k++) { c.fillStyle = k % 2 ? '#E9B949' : '#222'; c.fillRect(x - 60, 600 + k * 12, 120, 12); } txt(c, 'B2-' + l, x, 220, {font: `700 40px ${FB}`, color: '#1D1D1D', align: 'center'}); }
  car(c, 530, 700, 1.1, '#35393C'); car(c, 1080, 700, 1.1, '#3C4246');
  sign(c, 1420, 150, 150, 56, '#1E8C4E', '#fff', '비상구', 26);
  const r = rng(42); for (let k = 0; k < 26; k++) { const x = r() * W, y = 745 + r() * 120, s = .7 + r() * .3; c.fillStyle = '#2A2E31'; c.beginPath(); c.arc(x, y - 58 * s, 14 * s, 0, 7); c.fill(); rr(c, x - 18 * s, y - 46 * s, 36 * s, 46 * s, 12 * s); c.fill(); }
}
function familyAtPillar(c, T) {
  person(c, 690, 830, 1.15, CH.jw.c);
  person(c, 760, 830, 1.15, CH.sy.c, {long: true, item: '#8C8F8A'});
  person(c, 865, 830, 1.15, CH.pk.c, {hat: '#4A4038', cane: true});
  person(c, 940, 830, 1.15, CH.mj.c, {bag: '#5E6B45'});
  person(c, 1065, 830, 1.15, CH.sj.c, {kneel: true, reach: true});
  person(c, 1150, 830, .95, '#7D6FA8', {sit: true, flip: true});
}

/* ---------- 장면 ---------- */
const S = [
{

    for (let k = 0; k < 6; k++) { const x = 150 + (k % 3) * 76, y = 300 + Math.floor(k / 3) * 110, on = lit * 6 > k; c.fillStyle = '#9AA3A6'; rr(c, x, y, 50, 90, 6); c.fill(); c.fillStyle = on ? '#2E7D4F' : '#B03A25'; rr(c, x + 12, on ? y + 10 : y + 46, 26, 34, 4); c.fill(); }
    c.fillStyle = '#9AA3A6'; rr(c, 520, 560, 220, 140, 8); c.fill(); c.fillStyle = '#7A8488'; c.fillRect(615, 520, 10, 50); c.fillStyle = 'rgba(160,200,235,.8)'; c.fillRect(616, 570, 8, 60 + Math.sin(T * 8) * 4);
    c.fillStyle = '#E6E9EA'; rr(c, 820, 360, 160, 340, 10); c.fill(); c.fillStyle = '#C9CED0'; c.fillRect(820, 480, 160, 4);
    c.fillStyle = '#2E3A40'; rr(c, 1000, 620, 70, 80, 10); c.fill();
    person(c, 420, 840, 1.15, CH.jw.c, {armUp2: true, flip: true});
    person(c, 650, 840, 1.1, CH.sy.c, {long: true, reach: true, flip: true});

    if (p > .6) { c.fillStyle = 'rgba(255,255,255,.94)'; rr(c, 1120, 540, 420, 120, 12); c.fill(); txt(c, '피해 목록', 1150, 584, {font: `700 26px ${FB}`, color: '#263238'}); txt(c, '1. 베란다 유리 금 · 사진 3장', 1150, 630, {font: `500 24px ${FB}`, color: '#37474F'}); }
  }
},
{
  when: '복귀편 · D+120 · 1102호 거실', title: '가방을 다시 싼다',
  narr: '돌아온 지 엿새째, 피해 신고를 마치고 단지 사람들과 함께 화단의 유리 조각을 치웠다. 그날 밤 가족은 식탁에 다시 모였다. 넉 달 전 처음 계획을 세웠던 그 식탁이었다. 비어 버린 비상 가방을 다시 채우고, 계획서를 고쳐 썼다. 정우는 공책 맨 앞 장에, 외가 마루에서 적었던 문장 아래 한 줄을 더 보탰다.',
  lines: [['pk', '준비한 대로 움직였으니, 이제 준비를 다시 하는 거지.'], ['mj', '이번엔 내 주머니 키트부터 챙길래.']],

    c.fillStyle = '#9FB6C4'; c.fillRect(1300, 120, 240, 300); c.strokeStyle = '#7A6A55'; c.lineWidth = 14; c.strokeRect(1300, 120, 240, 300);
    c.save(); c.translate(640, 700); c.fillStyle = '#5E6B45'; rr(c, -120, -340, 240, 340, 50); c.fill(); c.fillStyle = '#4C5838'; rr(c, -90, -170, 180, 120, 24); c.fill(); c.restore();
    const items = ['약 · 4주 치', '물', '건전지', '현금 · 동전', '연락처 종이', '비닐 · 테이프', '주머니 키트'];
    items.forEach((s, k) => { const a = clamp(p * 1.4 * items.length - k); if (a <= 0) return; const x = (k % 2 ? 1030 : 790) + 60 * (1 - a), y = 170 + Math.floor(k / 2) * 80; c.globalAlpha = a; c.fillStyle = '#C8721E'; rr(c, x, y, 220, 56, 12); c.fill(); txt(c, s, x + 110, y + 37, {font: `600 24px ${FB}`, color: '#fff', align: 'center'}); c.globalAlpha = 1; });
    c.save(); c.translate(80, 120); c.rotate(-.02); c.fillStyle = '#FBF7EC'; c.fillRect(0, 0, 400, 420);
    c.fillStyle = '#2A2622'; c.font = `400 40px ${FH}`; c.textAlign = 'left'; c.fillText('계획서 · 고쳐 쓴 것', 20, 54);
    c.font = `400 32px ${FH}`; ['밖에선 가까운 지하 먼저', '화생방은 위로', '흩어지면 쪽지', '약은 2주 남으면', '난로는 자는 방 밖에서'].forEach((s, k) => { if (clamp(p * 2 - k * .2) > 0) c.fillText(s, 20, 120 + k * 56); });
    c.restore();
    person(c, 1100, 860, 1.15, CH.jw.c, {reach: true, flip: true});
    person(c, 1220, 860, 1.1, CH.mj.c, {item: '#E8E2CF'});
    person(c, 1340, 860, 1.1, CH.sy.c, {long: true});
    person(c, 1440, 860, 1.1, CH.sj.c);
    person(c, 1540, 860, 1.05, CH.pk.c, {hat: '#4A4038', cane: true, flip: true});
    if (p > .8) txt(c, '준비한 대로, 다시 준비한다', 800, 860, {font: `400 54px ${FH}`, color: '#1F4E7A', align: 'center'});

];

/* ---------- 플레이어 ---------- */
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let i = 0, t = 0, T = 0, playing = false, ended = false, last = performance.now();
/* 갈래: 본편 장면의 fork.to 로 들어가고, 끝나면 rejoin 이 같은 장면(없으면 갈라진 장면)으로 돌아온다 */
const BRANCHES = {
  apart: {scenes: BR_APART, end: '가족은 다시 모였어요. 그날 밤 화생방경보 장면부터 본편이 이어져요.', btn: '본편으로 이어 보기'},
  hospital: {scenes: BR_HOSPITAL, end: '본편에서는 서진이 가족과 함께 떠났어요. 출발 장면으로 돌아가요.', btn: '본편으로 돌아가기'},
  walk: {scenes: BR_WALK, end: '걸어서 외가 마을에 닿았어요. 피난지 생활 장면부터 본편이 이어져요.', btn: '본편으로 이어 보기'},
  long: {scenes: BR_LONG, end: '100일째, 돌아갈 조건은 아직 다 채워지지 않았어요. 그날의 이야기는 에필로그 아래 복귀편 버튼으로 이어져요.', btn: '에필로그로 가기'},
  return: {scenes: BR_RETURN, label: '복귀편', open: '복귀편 보기', end: '복귀편이 끝났어요. 에필로그로 돌아가요.', btn: '에필로그로 돌아가기'},
};
for (const [id, b] of Object.entries(BRANCHES)) { b.forkAt = S.findIndex(s => s.fork && s.fork.to === id); const r = S.findIndex(s => s.rejoin === id); b.rejoin = r >= 0 ? r : b.forkAt; }
/* 지금 보는 장면 목록: 본편(S) 또는 갈래 하나 */
let seq = S, branch = null, segs = [];

function dur(k) { const s = seq[k]; const len = (s.narr || '').length + (s.lines || []).reduce((a, l) => a + l[1].length, 0) + (s.card ? s.card.items.join('').length : 0); return Math.min(30, Math.max(9, 4 + len * .05)); }

function buildSegs() {
  $('progress').replaceChildren();
  seq.forEach((s, k) => { const b = document.createElement('button'); b.className = 'seg'; b.type = 'button'; b.setAttribute('aria-label', `${branch ? (branch.label || '갈래') + ' ' : ''}${k + 1}번 장면: ${s.title}`); b.appendChild(document.createElement('i')); b.addEventListener('click', () => go(k, false)); $('progress').appendChild(b); });
  segs = [...$('progress').children];
}
buildSegs();
function enterBranch(id) { branch = BRANCHES[id]; seq = branch.scenes; buildSegs(); go(0, playing); }
function leaveBranch(k) { branch = null; seq = S; buildSegs(); go(k, playing); }

function renderCaption(animate) {
  const s = seq[i], cap = $('caption');
  cap.classList.remove('animate'); void cap.offsetWidth; if (animate && !reduce) cap.classList.add('animate');
  $('chip').textContent = s.when; $('eyebrow').textContent = s.when; $('title').textContent = s.title; $('narr').textContent = s.narr;
  cv.setAttribute('aria-label', `${s.when}, ${s.title}`);
  const ul = $('lines'); ul.replaceChildren();
  (s.lines || []).forEach(([who, say], k) => { const li = document.createElement('li'); li.style.setProperty('--d', (1 + k * 2.2).toFixed(1)); const w = document.createElement('span'); w.className = 'who'; w.style.setProperty('--c', CH[who].c); w.textContent = CH[who].name; const q = document.createElement('span'); q.className = 'say'; q.textContent = say; li.append(w, q); ul.append(li); });
  ul.hidden = !(s.lines && s.lines.length);
  const card = $('card');
  if (s.card) { card.hidden = false; cap.classList.remove('solo'); $('cardTitle').textContent = s.card.title; const ol = $('cardItems'); ol.replaceChildren(); s.card.items.forEach((it, k) => { const li = document.createElement('li'); li.style.setProperty('--d', (1.5 + k * 1).toFixed(1)); li.textContent = it; ol.append(li); }); }
  else { card.hidden = true; cap.classList.add('solo'); }
  const fork = $('fork'), atEnd = branch && i === seq.length - 1;
  fork.hidden = !(atEnd || (!branch && s.fork));
  if (atEnd) { $('forkText').textContent = branch.end; $('forkBtn').textContent = branch.btn; }
  else if (!fork.hidden) { $('forkText').textContent = s.fork.text; $('forkBtn').textContent = BRANCHES[s.fork.to].open || '갈래 보기'; }
  $('back').hidden = !branch;
  $('count').textContent = `${branch ? (branch.label || '갈래') + ' ' : ''}${i + 1} / ${seq.length}`;
}
function go(k, auto) { i = clamp(k, 0, seq.length - 1); t = 0; ended = false; renderCaption(auto); syncSound(); updateButtons(); }
function updateButtons() { $('play').textContent = ended ? '처음부터' : playing ? '일시정지' : '재생'; $('prev').disabled = i === 0; $('next').disabled = i === seq.length - 1; }
$('forkBtn').addEventListener('click', () => branch ? leaveBranch(branch.rejoin) : enterBranch(seq[i].fork.to));
$('back').addEventListener('click', () => leaveBranch(branch.forkAt));
function togglePlay() { if (ended) { playing = true; go(0, true); return; } playing = !playing; if (playing && t === 0) renderCaption(true); syncSound(); updateButtons(); }

/* 사이렌 소리: 사용자가 켰을 때만, 재생 중인 경보 장면에서만 */
let actx = null, siren = null, soundOn = false;
function stopSiren() { if (!siren) return; const {o, g, lfo} = siren, n = actx.currentTime; g.gain.cancelScheduledValues(n); g.gain.setValueAtTime(g.gain.value, n); g.gain.linearRampToValueAtTime(0, n + .4); o.stop(n + .5); if (lfo) lfo.stop(n + .5); siren = null; }
function startSiren(kind) { stopSiren(); if (!actx) return; const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; let lfo = null; if (kind === 'raid') { lfo = actx.createOscillator(); const lg = actx.createGain(); lfo.frequency.value = .16; lg.gain.value = 230; lfo.connect(lg); lg.connect(o.frequency); o.frequency.value = 640; lfo.start(); } else o.frequency.value = 620; g.gain.value = 0; g.gain.linearRampToValueAtTime(.05, actx.currentTime + .8); o.connect(g); g.connect(actx.destination); o.start(); siren = {o, g, lfo}; }
function syncSound() { const snd = seq[i].sound, want = soundOn && playing && snd; if (want && (!siren || siren.kind !== snd)) { startSiren(snd); if (siren) siren.kind = snd; } else if (!want) stopSiren(); }
$('sound').addEventListener('click', () => { soundOn = !soundOn; if (soundOn && !actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } } if (actx && actx.state === 'suspended') actx.resume(); $('sound').setAttribute('aria-pressed', String(soundOn)); $('sound').textContent = soundOn ? '사이렌 소리 켜짐' : '사이렌 소리 꺼짐'; syncSound(); });

$('play').addEventListener('click', togglePlay);
$('prev').addEventListener('click', () => go(i - 1, false));
$('next').addEventListener('click', () => go(i + 1, false));
document.addEventListener('keydown', e => { if (e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return; if (e.key === ' ') { e.preventDefault(); togglePlay(); } else if (e.key === 'ArrowRight') go(i + 1, false); else if (e.key === 'ArrowLeft') go(i - 1, false); });

let scale = 1;
function resize() { const dpr = Math.min(2, window.devicePixelRatio || 1), w = cv.clientWidth, h = cv.clientHeight; cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); scale = cv.width / W; }
new ResizeObserver(resize).observe(cv); resize();

function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (!reduce) T += dt;
  if (playing) { t += dt; if (t >= dur(i)) { if (i < seq.length - 1) go(i + 1, true); else if (branch) leaveBranch(branch.rejoin); else { playing = false; ended = true; t = dur(i); syncSound(); updateButtons(); } } }
  const d = dur(i), p = reduce || (!playing && t === 0) ? 1 : clamp(t / (d * .6));
  ctx.setTransform(scale, 0, 0, scale, 0, 0); ctx.clearRect(0, 0, W, H);
  try { seq[i].draw(ctx, reduce ? d : t, reduce ? 0 : T, p); } catch (err) { console.error(err); }
  segs.forEach((b, k) => { b.firstChild.style.width = (k < i ? 100 : k === i ? clamp(t / d) * 100 : 0) + '%'; });
  requestAnimationFrame(frame);
}
go(0, false);
requestAnimationFrame(frame);
</script>
